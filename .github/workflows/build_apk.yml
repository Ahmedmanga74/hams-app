              '        fun cancelAlertNotif(ctx: Context) {',
              '            try {',
              '                val m = ctx.getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager',
              '                m.cancel(ALERT_NOTIF_ID)',
