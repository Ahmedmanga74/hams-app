name: Hams | هَمْس Play Store & APK Release

on:
  push:
  workflow_dispatch:

jobs:
  build_apk:
    runs-on: ubuntu-24.04
    steps:
      - name: 1. Checkout Repository Files
        uses: actions/checkout@v4

      - name: 2. Backup MP3s, Keystore & Local Adhkar
        run: |
          mkdir -p /tmp/hams_backup/audio
          find . -maxdepth 3 -iname "*.mp3" -exec cp {} /tmp/hams_backup/audio/ \; || true
          if [ -f "hams_release.keystore" ]; then cp hams_release.keystore /tmp/hams_backup/hams_release.keystore; fi
          if [ -f "adhkar.json" ]; then cp adhkar.json /tmp/hams_backup/adhkar.json; fi
          if [ -f "azkar.json" ]; then cp azkar.json /tmp/hams_backup/adhkar.json; fi
          ls -la /tmp/hams_backup/
          ls -la /tmp/hams_backup/audio/

      - name: 3. Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 4. Install Pillow & Noto Arabic Font for Exact Splash Icon
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pil fonts-noto-core

      - name: 5. Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.8'
          channel: 'stable'

      - name: 6. Create Clean Flutter Project & Map All 12 MP3s
        shell: python3 {0}
        run: |
          import os, glob, shutil, subprocess

          for item in ["android", "ios", "lib", "test", "pubspec.yaml", "pubspec.lock", ".metadata", "assets"]:
              if os.path.exists(item):
                  if os.path.isdir(item): shutil.rmtree(item)
                  else: os.remove(item)

          subprocess.run(["flutter", "create", "--org", "com.hams.salawat", "--project-name", "hams", "."], check=True)
          os.makedirs("assets/audio", exist_ok=True
