              "  Widget _buildAdhkarTab() {",
              "    final allItems = [];",
              "    for (final rawCat in _adhkarCategories) {",
              "      if (rawCat is Map && rawCat['items'] is List) {",
              "        allItems.addAll((rawCat['items'] as List).where((e) => e is Map));",
              "      }",
              "    }",
              "    final displayCats = [",
              "      ..._adhkarCategories,",
              "      if (_adhkarCategories.length == 5)",
              "        {'id': 'all', 'title': 'كل الأذكار', 'icon': 'all_inclusive', 'items': allItems},",
              "    ];",
              "    return ListView(",
              "      padding: const EdgeInsets.fromLTRB(14, 14, 14, 20),",
              "      children: [",
              "        if (_adhkarCategories.isEmpty)",
              "          const Center(child: Padding(padding: EdgeInsets.all(40), child: CircularProgressIndicator(color: Color(0xFF2D6E68))))",
              "        else",
              "          GridView.builder(",
              "            shrinkWrap: true,",
              "            physics: const NeverScrollableScrollPhysics(),",
              "            itemCount: displayCats.length,",
              "            gridDelegate: const SliverGridDelegateWithFixedCrossAxisCount(",
              "              crossAxisCount: 2,",
              "              crossAxisSpacing: 12,",
              "              mainAxisSpacing: 12,",
              "              childAspectRatio: 1.85,",
              "            ),",
              "            itemBuilder: (ctx, idx) {",
              "              final rawCat = displayCats[idx];",
              "              final cat = rawCat is Map ? rawCat : {};",
              "              final title = cat['title']?.toString() ?? 'أذكار';",
              "              final iconName = cat['icon']?.toString() ?? 'auto_awesome';",
              "              final accent = _colorForCategory(iconName);",
