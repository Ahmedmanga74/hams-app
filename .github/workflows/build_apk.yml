              '                    val idx = (call.argument<Int>("index") ?: 0).coerceIn(0, 11)',
              '                    val volPct = (call.argument<Int>("volumePct") ?: 80).coerceIn(10, 100)',
              '                    val showNotif = call.argument<Boolean>("showNotif") ?: true',
              '                    HamsForegroundService.playVoiceAndAutoDismissNotif(this, idx, volPct / 100f, showNotif)',
              '                    result.success(true)',
              '                }',
              '                "checkPermissions" -> {',
              '                    val n = if (Build.VERSION.SDK_INT >= 33) ContextCompat.checkSelfPermission(this, "android.permission.POST_NOTIFICATIONS") == PackageManager.PERMISSION_GRANTED else true',
              '                    val pm = getSystemService(Context.POWER_SERVICE) as PowerManager',
              '                    val b = if (Build.VERSION.SDK_INT >= 23) pm.isIgnoringBatteryOptimizations(packageName) else true',
              '                    val o = if (Build.VERSION.SDK_INT >= 23) Settings.canDrawOverlays(this) else true',
              '                    result.success(mapOf("notif" to n, "battery" to b, "overlay" to o))',
              '                }',
              '                "requestNotificationPermission" -> {',
              '                    if (Build.VERSION.SDK_INT >= 33) ActivityCompat.requestPermissions(this, arrayOf("android.permission.POST_NOTIFICATIONS"), 101)',
              '                    result.success(true)',
              '                }',
              '                "requestBatteryExemption" -> {',
              '                    try { startActivity(Intent(Settings.ACTION_REQUEST_IGNORE_BATTERY_OPTIMIZATIONS, Uri.parse("package:" + packageName))) } catch (_: Exception) {}',
              '                    result.success(true)',
              '                }',
              '                "requestOverlayPermission" -> {',
              '                    try { if (Build.VERSION.SDK_INT >= 23) startActivity(Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:" + packageName))) } catch (_: Exception) {}',
              '                    result.success(true)',
              '                }',
              '                "showNotification" -> {',
              '                    HamsForegroundService.showTransientAlertNotif(this, call.argument<String>("title") ?: "\\u200EHams | هَمْس", call.argument<String>("body") ?: "")',
              '                    result.success(true)',
              '                }',
              '                else -> result.notImplemented()',
              '            }',
              '        }',
              '    }',
              '    private fun startHamsService() {',
              '        try {',
              '            val i = Intent(this, HamsForegroundService::class.java).apply { action = "UPDATE_TIMER" }',
              '            if (Build.VERSION.SDK_INT >= 26) startForegroundService(i) else startService(i)',
              '        } catch (_: Exception) {}',
              '    }',
              '}'
          ]
          open(main_kt_path, "w", encoding="utf-8").write("\n".join(main_lines))
          print("All Dart, Kotlin, Adhkar UI, and Exact Splash Icons generated cleanly!")

      - name: 9. Compile & Sign Release APK + Play Store AAB with Persistent Key
        run: |
          mkdir -p ~/.android
          if [ -f "/tmp/hams_backup/hams_release.keystore" ]; then
            cp /tmp/hams_backup/hams_release.keystore google_play_assets/hams_release.keystore
            echo "Restored persistent hams_release.keystore from repository!"
          else
            keytool -genkey -v -keystore google_play_assets/hams_release.keystore \
              -alias hams_key -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "hams_store_2026" -keypass "hams_store_2026" \
              -dname "CN=Hams App, OU=Hams, O=Hams, L=Cairo, S=Cairo, C=EG"
          fi

          rm -f ~/.android/debug.keystore
          keytool -importkeystore -srckeystore google_play_assets/hams_release.keystore \
            -destkeystore ~/.android/debug.keystore \
            -srcstorepass "hams_store_2026" -deststorepass "android" \
            -srcalias hams_key -destalias androiddebugkey \
            -srckeypass "hams_store_2026" -destkeypass "android" -noprompt

          flutter pub get
          flutter build apk --release --no-tree-shake-icons
          flutter build appbundle --release --no-tree-shake-icons

          jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 \
            -keystore google_play_assets/hams_release.keystore \
            -storepass "hams_store_2026" -keypass "hams_store_2026" \
            build/app/outputs/bundle/release/app-release.aab hams_key

          cp build/app/outputs/flutter-apk/app-release.apk google_play_assets/hams-release.apk
          cp build/app/outputs/bundle/release/app-release.aab google_play_assets/hams-release.aab
          ls -lh google_play_assets/

      - name: 10. Upload Hams APK & Google Play Package
        uses: actions/upload-artifact@v4
        with:
          name: Hams-APK
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            google_play_assets/
