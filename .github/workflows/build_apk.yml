                            fontWeight: FontWeight.w900,
                            fontSize: 14,
                            color: Color(0xFF064E3B),
                          ),
                        ),
                        SizedBox(height: 6),
                        Text(
                          'متوافق مع معايير الخصوصية والأمان في متجري Google Play و Apple App Store.',
                          style: TextStyle(fontSize: 12, color: Color(0xFF065F46)),
                        ),
                      ],
                    ),
                  ),
                  const SizedBox(height: 14),
                  Container(
                    padding: const EdgeInsets.all(18),
                    decoration: BoxDecoration(
                      color: Colors.white,
                      borderRadius: BorderRadius.circular(20),
                      border: Border.all(color: const Color(0xFFE5E7EB)),
                    ),
                    child: const Column(
                      crossAxisAlignment: CrossAxisAlignment.start,
                      children: [
                        Text(
                          '1. عدم جمع أو مشاركة البيانات الشخصية:',
                          style: TextStyle(
                            fontWeight: FontWeight.w900,
                            fontSize: 14,
                            color: Color(0xFF064E3B),
                          ),
                        ),
                        SizedBox(height: 4),
                        Text(
                          'صُمم تطبيق «هَمْس | Hams» ليكون صدقة جارية ورفيقاً روحانياً خالصاً؛ لذا فإن التطبيق لا يجمع، ولا يخزن في خوادم خارجية، ولا يشارك أي بيانات شخصية أو موقع جغرافي أو جهات اتصال مع أي طرف ثالث.',
                          style: TextStyle(fontSize: 12.5, height: 1.6),
                        ),
                        SizedBox(height: 14),
                        Text(
                          '2. التخزين المحلي فقط (On-Device Storage):',
                          style: TextStyle(
                            fontWeight: FontWeight.w900,
                            fontSize: 14,
                            color: Color(0xFF064E3B),
                          ),
                        ),
                        SizedBox(height: 4),
                        Text(
                          'جميع إحصائيات صلواتك على النبي ﷺ، وعداد المسبحة، وتفضيلات الصوت ومعدل التكرار تُحفظ محلياً داخل ذاكرة هاتفك فقط (SharedPreferences)، ويمكنك تصفيرها أو حذفها في أي وقت.',
                          style: TextStyle(fontSize: 12.5, height: 1.6),
                        ),
                        SizedBox(height: 14),
                        Text(
                          '3. الأذونات المطلوبة وسبب استخدامها:',
