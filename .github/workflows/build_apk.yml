              "",
              "class HamsAdhkarDetailScreen extends StatefulWidget {",
              "  final List categories;",
              "  final int initialIndex;",
              "  const HamsAdhkarDetailScreen({super.key, required this.categories, required this.initialIndex});",
              "  @override",
              "  State<HamsAdhkarDetailScreen> createState() => _HamsAdhkarDetailScreenState();",
              "}",
              "",
              "class _HamsAdhkarDetailScreenState extends State<HamsAdhkarDetailScreen> {",
              "  late int _selectedCatIndex;",
              "  final Map<int, List<int>> _catCounters = {};",
              "  double _fontSize = 21.0;",
              "",
              "  @override",
              "  void initState() {",
              "    super.initState();",
              "    _selectedCatIndex = widget.initialIndex.clamp(0, widget.categories.isEmpty ? 0 : widget.categories.length - 1);",
              "    _ensureCountersFor(_selectedCatIndex);",
              "  }",
              "",
              "  List _itemsForCat(int idx) {",
              "    if (idx < 0 || idx >= widget.categories.length) return [];",
              "    final raw = widget.categories[idx];",
              "    if (raw is Map && raw['items'] is List) {",
              "      return (raw['items'] as List).where((e) => e is Map).toList();",
              "    }",
              "    return [];",
              "  }",
              "",
              "  void _ensureCountersFor(int idx) {",
              "    if (_catCounters.containsKey(idx)) return;",
              "    final items = _itemsForCat(idx);",
              "    _catCounters[idx] = items.map((raw) {",
              "      final item = raw is Map ? raw : {};",
              "      final c = int.tryParse(item['count']?.toString() ?? '1') ?? 1;",
              "      return c > 0 ? c : 1;",
              "    }).toList();",
              "  }",
              "",
              "  void _resetCurrentCategory() {",
              "    HapticFeedback.mediumImpact();",
              "    final items = _itemsForCat(_selectedCatIndex);",
              "    setState(() {",
              "      _catCounters[_selectedCatIndex] = items.map((raw) {",
              "        final item = raw is Map ? raw : {};",
              "        final c = int.tryParse(item['count']?.toString() ?? '1') ?? 1;",
              "        return c > 0 ? c : 1;",
              "      }).toList();",
              "    });",
              "  }",
              "",
              "  Future<void> _shareDhikr(String text, String note) async {",
              "    final full = note.isNotEmpty ? '$text\\n\\n$note\\n\\n— تطبيق Hams | هَمْس' : '$text\\n\\n— تطبيق Hams | هَمْس';",
              "    try {",
              "      await _nativeChannel.invokeMethod('shareText', {'text': full});",
              "    } catch (_) {",
              "      await Clipboard.setData(ClipboardData(text: full));",
              "      if (mounted) {",
              "        ScaffoldMessenger.of(context).showSnackBar(",
              "          const SnackBar(backgroundColor: Color(0xFF2D6E68), content: Text('تم نسخ الذكر لمشاركته'), duration: Duration(seconds: 2)),",
              "        );",
              "      }",
              "    }",
              "  }",
              "",
              "  void _showFontSizeSheet() {",
              "    showModalBottomSheet(",
              "      context: context,",
              "      backgroundColor: Colors.white,",
              "      shape: const RoundedRectangleBorder(borderRadius: BorderRadius.vertical(top: Radius.circular(22))),",
              "      builder: (ctx) {",
