          def create_exact_splash_icon(filename, target_size):
              canvas_sz = 1024
              img = Image.new("RGBA", (canvas_sz, canvas_sz), (6, 78, 59, 255))
              draw = ImageDraw.Draw(img)

              margin = int(canvas_sz * 0.045)
              radius = int(canvas_sz * 0.25)
              border_w = int(canvas_sz * 0.035)

              draw.rounded_rectangle(
                  [margin, margin, canvas_sz - margin, canvas_sz - margin],
                  radius=radius,
                  fill=(6, 78, 59, 255),
                  outline=(245, 158, 11, 255),
                  width=border_w
              )

              if selected_font:
                  fnt = ImageFont.truetype(selected_font, int(canvas_sz * 0.54))
                  bbox = draw.textbbox((0, 0), "ﷺ", font=fnt)
                  tw = bbox[2] - bbox[0]
                  th = bbox[3] - bbox[1]
                  tx = (canvas_sz - tw) / 2.0 - bbox[0]
                  ty = (canvas_sz - th) / 2.0 - bbox[1]
                  draw.text((tx, ty), "ﷺ", font=fnt, fill=(251, 191, 36, 255))

              out = img.resize((target_size, target_size), Image.Resampling.LANCZOS)
              os.makedirs(os.path.dirname(filename), exist_ok=True)
              out.save(filename, "PNG")

