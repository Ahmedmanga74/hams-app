              "class HamsAdhkarDetailScreen extends StatefulWidget {",
              "  final String title;",
              "  final List items;",
              "  const HamsAdhkarDetailScreen({super.key, required this.title, required this.items});",
              "  @override",
              "  State<HamsAdhkarDetailScreen> createState() => _HamsAdhkarDetailScreenState();",
              "}",
              "",
              "class _HamsAdhkarDetailScreenState extends State<HamsAdhkarDetailScreen> {",
              "  late List<int> _remaining;",
              "  double _fontSize = 18.0;",
              "",
              "  @override",
              "  void initState() {",
              "    super.initState();",
              "    _resetAll(notify: false);",
              "  }",
              "",
              "  void _resetAll({bool notify = true}) {",
              "    final initList = widget.items.map((raw) {",
              "      final item = raw is Map ? raw : {};",
              "      final c = int.tryParse(item['count']?.toString() ?? '1') ?? 1;",
              "      return c > 0 ? c : 1;",
              "    }).toList();",
              "    if (notify) {",
              "      HapticFeedback.mediumImpact();",
              "      setState(() => _remaining = initList);",
              "    } else {",
              "      _remaining = initList;",
              "    }",
              "  }",
              "",
              "  @override",
              "  Widget build(BuildContext context) {",
              "    final total = widget.items.length;",
              "    final done = _remaining.where((r) => r == 0).length;",
              "    final progress = total == 0 ? 0.0 : (done / total).clamp(0.0, 1.0);",
              "    return Scaffold(",
              "      backgroundColor: const Color(0xFFF4F7F5),",
              "      appBar: AppBar(",
              "        backgroundColor: const Color(0xFF064E3B),",
              "        foregroundColor: Colors.white,",
              "        title: Text(widget.title, style: const TextStyle(fontWeight: FontWeight.w900, fontSize: 18)),",
              "        actions: [",
              "          IconButton(",
              "            tooltip: 'تصغير الخط',",
              "            icon: const Icon(Icons.text_decrease_rounded),",
              "            onPressed: () => setState(() => _fontSize = (_fontSize - 2).clamp(14.0, 28.0)),",
              "          ),",
              "          IconButton(",
              "            tooltip: 'تكبير الخط',",
              "            icon: const Icon(Icons.text_increase_rounded),",
              "            onPressed: () => setState(() => _fontSize = (_fontSize + 2).clamp(14.0, 28.0)),",
              "          ),",
              "          IconButton(",
              "            tooltip: 'إعادة العدادات',",
              "            icon: const Icon(Icons.refresh_rounded),",
              "            onPressed: () => _resetAll(),",
              "          ),",
              "        ],",
              "      ),",
              "      body: Column(",
              "        children: [",
              "          Container(",
              "            color: Colors.white,",
              "            padding: const EdgeInsets.symmetric(horizontal: 16, vertical: 10),",
              "            child: Column(",
              "              children: [",
              "                Row(",
              "                  mainAxisAlignment: MainAxisAlignment.spaceBetween,",
              "                  children: [",
              "                    const Text('نسبة الإنجاز', style: TextStyle(fontWeight: FontWeight.bold, fontSize: 13, color: Color(0xFF374151))),",
              "                    Text('$done / $total', style: const TextStyle(fontWeight: FontWeight.w900, fontSize: 13.5, color: Color(0xFF065F46))),",
              "                  ],",
              "                ),",
              "                const SizedBox(height: 6),",
              "                ClipRRect(",
              "                  borderRadius: BorderRadius.circular(8),",
              "                  child: LinearProgressIndicator(value: progress, minHeight: 8, backgroundColor: const Color(0xFFF3F4F6), valueColor: const AlwaysStoppedAnimation<Color>(Color(0xFF15803D))),",
              "                ),",
              "              ],",
              "            ),",
              "          ),",
              "          Expanded(",
              "            child: widget.items.isEmpty",
              "                ? const Center(child: Text('لا توجد أذكار في هذا القسم حالياً', style: TextStyle(color: Colors.grey)))",
              "                : ListView.builder(",
              "                    padding: const EdgeInsets.all(14),",
              "                    itemCount: widget.items.length,",
              "                    itemBuilder: (ctx, i) {",
              "                      final raw = widget.items[i];",
              "                      final item = raw is Map ? raw : {};",
              "                      final text = item['text']?.toString() ?? '';",
              "                      final note = item['note']?.toString() ?? '';",
              "                      final target = int.tryParse(item['count']?.toString() ?? '1') ?? 1;",
              "                      final rem = _remaining[i];",
              "                      final isDone = rem == 0;",
              "                      return GestureDetector(",
              "                        onTap: () {",
              "                          if (rem > 0) {",
              "                            if (rem == 1) {",
              "                              HapticFeedback.mediumImpact();",
              "                            } else {",
              "                              HapticFeedback.lightImpact();",
              "                            }",
              "                            setState(() => _remaining[i] = rem - 1);",
              "                          }",
              "                        },",
              "                        child: AnimatedContainer(",
              "                          duration: const Duration(milliseconds: 220),",
              "                          margin: const EdgeInsets.only(bottom: 12),",
              "                          padding: const EdgeInsets.all(16),",
              "                          decoration: BoxDecoration(",
              "                            color: isDone ? const Color(0xFFECFDF5) : Colors.white,",
              "                            borderRadius: BorderRadius.circular(18),",
              "                            border: Border.all(color: isDone ? const Color(0xFF10B981) : const Color(0xFFE5E7EB), width: isDone ? 1.6 : 1.0),",
              "                          ),",
              "                          child: Column(",
              "                            crossAxisAlignment: CrossAxisAlignment.stretch,",
              "                            children: [",
              "                              Text(text, textAlign: TextAlign.justify, style: TextStyle(fontSize: _fontSize, height: 1.8, fontWeight: FontWeight.w600, color: isDone ? const Color(0xFF065F46) : const Color(0xFF111827))),",
              "                              if (note.isNotEmpty) ...[",
              "                                const SizedBox(height: 8),",
              "                                Text(note, style: const TextStyle(fontSize: 12, color: Color(0xFF6B7280), height: 1.4)),",
              "                              ],",
              "                              const SizedBox(height: 12),",
              "                              Row(",
              "                                mainAxisAlignment: MainAxisAlignment.spaceBetween,",
              "                                children: [",
              "                                  Text('التكرار المطلوب: $target', style: const TextStyle(fontSize: 12, color: Colors.grey, fontWeight: FontWeight.bold)),",
              "                                  Container(",
              "                                    padding: const EdgeInsets.symmetric(horizontal: 16, vertical: 7),",
              "                                    decoration: BoxDecoration(",
              "                                      color: isDone ? const Color(0xFF15803D) : const Color(0xFF064E3B),",
              "                                      borderRadius: BorderRadius.circular(20),",
              "                                    ),",
              "                                    child: Text(",
              "                                      isDone ? '✓ تم بحمد الله' : 'المتبقي: $rem',",
              "                                      style: const TextStyle(color: Colors.white, fontWeight: FontWeight.bold, fontSize: 13),",
              "                                    ),",
              "                                  ),",
              "                                ],",
              "                              ),",
              "                            ],",
              "                          ),",
              "                        ),",
              "                      );",
              "                    },",
              "                  ),",
              "          ),",
              "        ],",
              "      ),",
              "    );",
              "  }",
              "}",
