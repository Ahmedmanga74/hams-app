          bitmap_rows = [int(CALLIGRAPHY_HEX[i*16:(i+1)*16], 16) for i in range(64)]

          def is_calligraphy_pixel(nx, ny):
              # nx, ny in [0.0, 1.0] -> map to 64x64 grid with bilinear smoothing
              gx = nx * 63.0
              gy = ny * 63.0
              x0, y0 = int(gx), int(gy)
              if x0 < 0 or x0 >= 64 or y0 < 0 or y0 >= 64:
                  return False
              return ((bitmap_rows[y0] >> (63 - x0)) & 1) == 1

          def rounded_rect_dist(x, y, cx, cy, half_w, radius):
              dx = max(abs(x - cx) - (half_w - radius), 0.0)
              dy = max(abs(y - cy) - (half_w - radius), 0.0)
              return math.sqrt(dx*dx + dy*dy) - radius

          def write_png(filename, width, height, raw_data):
              def png_chunk(t, d):
                  return struct.pack(">I", len(d)) + t + d + struct.pack(">I", zlib.crc32(t + d) & 0xffffffff)
              ihdr = struct.pack(">IIBBBBB", width, height, 8, 6, 0, 0, 0)
              png = b"\x89PNG\r\n\x1a\n" + png_chunk(b"IHDR", ihdr) + png_chunk(b"IDAT", zlib.compress(bytes(raw_data), 9)) + png_chunk(b"IEND", b"")
              os.makedirs(os.path.dirname(filename), exist_ok=True)
              open(filename, "wb").write(png)

          def create_calligraphy_icon(filename, size):
              raw_data = bytearray()
              cx, cy = size / 2.0, size / 2.0
              outer_half = size * 0.445
              inner_half = size * 0.395
              outer_rad = size * 0.22
              inner_rad = size * 0.18

              for y in range(size):
                  raw_data.append(0)
                  for x in range(size):
                      d_out = rounded_rect_dist(x, y, cx, cy, outer_half, outer_rad)
                      d_in = rounded_rect_dist(x, y, cx, cy, inner_half, inner_rad)

                      # خلفية الأيقونة الخضراء الداكنة (#064E3B)
                      r, g, b, a = 6, 78, 59, 255

                      # الإطار الذهبي الدائري الحواف (#D97706)
                      if d_out <= 0.0 and d_in >= 0.0:
                          r, g, b, a = 217, 119, 6, 255
                      elif d_in < 0.0:
                          nx = (x - (cx - size * 0.36)) / (size * 0.72)
                          ny = (y - (cy - size * 0.36)) / (size * 0.72)
                          if 0.0 <= nx <= 1.0 and 0.0 <= ny <= 1.0 and is_calligraphy_pixel(nx, ny):
                              r, g, b, a = 245, 185, 35, 255

                      raw_data.extend([r, g, b, a])

              write_png(filename, size, size, raw_data)

