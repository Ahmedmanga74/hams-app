                      border: Border.all(color: const Color(0xFFE5E7EB)),
                    ),
                    child: Column(
                      crossAxisAlignment: CrossAxisAlignment.start,
                      children: [
                        Row(
                          mainAxisAlignment: MainAxisAlignment.spaceBetween,
                          children: [
                            const Text(
                              '🔊 مستوى صوت الهمسة المستقل',
                              style: TextStyle(
                                fontWeight: FontWeight.w900,
                                fontSize: 14.5,
                                color: Color(0xFF064E3B),
                              ),
                            ),
                            Text(
                              '$_volumePct%',
                              style: const TextStyle(
                                fontWeight: FontWeight.w900,
                                color: Color(0xFF064E3B),
                              ),
                            ),
                          ],
                        ),
                        Slider(
                          value: _volumePct.toDouble(),
                          min: 10,
                          max: 100,
                          activeColor: const Color(0xFF064E3B),
                          onChanged: (val) {
                            setState(() => _volumePct = val.round());
                            _audioPlayer.setVolume((_volumePct / 100.0).clamp(0.05, 1.0));
                            _saveData();
                          },
                        ),
                        const Text(
                          'يتحكم بقوة صوت التذكير بشكل مستقل عن مستوى وسائط الهاتف مع خفض الأصوات الأخرى بلطف أثناء الهمسة.',
                          style: TextStyle(fontSize: 11.5, color: Colors.grey, height: 1.5),
                        ),
                      ],
                    ),
                  ),
                  const SizedBox(height: 14),

                  // بطاقة أوقات الهدوء (عدم الإزعاج)
                  Container(
                    padding: const EdgeInsets.all(16),
                    decoration: BoxDecoration(
                      color: Colors.white,
                      borderRadius: BorderRadius.circular(20),
                      border: Border.all(color: const Color(0xFFE5E7EB)),
                    ),
                    child: Column(
                      children: [
                        CheckboxListTile(
                          contentPadding: EdgeInsets.zero,
                          activeColor: const Color(0xFF064E3B),
                          value: _quietHours,
                          title: const Text(
                            '🌙 أوقات الهدوء (عدم الإزعاج)',
                            style: TextStyle(
                              fontWeight: FontWeight.w900,
                              fontSize: 14.5,
                              color: Color(0xFF064E3B),
                            ),
                          ),
                          subtitle: Text(
                            _quietHours
                                ? 'يتم كتم الصوت تلقائياً من $_quietStart:00 إلى $_quietEnd:00'
                                : 'التطبيق يعمل حالياً 24 ساعة بدون توقف',
                            style: const TextStyle(fontSize: 11.5, color: Colors.grey),
                          ),
                          onChanged: (v) {
                            setState(() => _quietHours = v ?? false);
                            _saveData();
                          },
                        ),
                      ],
                    ),
                  ),
                  const SizedBox(height: 14),

                  // بطاقة أذونات الهاتف (مع إضافة خيار العرض فوق التطبيقات الأخرى والتنبيه المطلوب)
                  Container(
                    padding: const EdgeInsets.all(16),
                    decoration: BoxDecoration(
                      color: Colors.white,
                      borderRadius: BorderRadius.circular(20),
                      border: Border.all(color: const Color(0xFFE5E7EB)),
                    ),
                    child: Column(
                      crossAxisAlignment: CrossAxisAlignment.start,
                      children: [
                        const Text(
                          '🛡️ أذونات الهاتف والعمل في الخلفية',
                          style: TextStyle(
                            fontWeight: FontWeight.w900,
                            fontSize: 15,
                            color: Color(0xFF064E3B),
                          ),
                        ),
                        const SizedBox(height: 10),

                        // 1. إذن العرض فوق التطبيقات الأخرى مع نص التنبيه المطلوب حرفياً
                        SwitchListTile(
                          contentPadding: EdgeInsets.zero,
                          activeColor: const Color(0xFF064E3B),
                          value: _permOverlay,
                          title: const Text(
                            'العرض فوق التطبيقات الأخرى',
                            style: TextStyle(fontWeight: FontWeight.bold, fontSize: 13.5),
                          ),
                          subtitle: const Padding(
                            padding: EdgeInsets.only(top: 4),
                            child: Text(
                              'يسمح هذا الإذن للتطبيق بالظهور فوق التطبيقات الأخرى . وقد يؤثر ذلك في كيفية عرض التطبيقات الأخرى .',
                              style: TextStyle(
                                fontSize: 11.5,
                                color: Color(0xFFB45309),
                                height: 1.5,
                              ),
                            ),
                          ),
                          onChanged: (_) async {
                            try {
                              await _nativeChannel.invokeMethod('requestOverlayPermission');
                            } catch (_) {}
                          },
                        ),
                        const Divider(),

                        // 2. إذن الإشعارات
                        SwitchListTile(
                          contentPadding: EdgeInsets.zero,
                          activeColor: const Color(0xFF064E3B),
                          value: _permNotif && _notificationsEnabled,
                          title: const Text(
                            'إذن الإشعارات والتنبيهات الصوتية',
                            style: TextStyle(fontWeight: FontWeight.bold, fontSize: 13.5),
                          ),
                          subtitle: Text(
                            _permNotif
                                ? 'مفعل ويعرض إشعار الذكر مع كل همسة'
                                : 'اضغط لمنح إذن الإشعارات للتطبيق',
                            style: const TextStyle(fontSize: 11.5, color: Colors.grey),
                          ),
                          onChanged: (val) async {
                            try {
                              await _nativeChannel.invokeMethod('requestNotificationPermission');
                              setState(() => _notificationsEnabled = val);
                              await _saveData();
                              await _refreshPermissions();
                            } catch (_) {}
                          },
                        ),
                        const Divider(),

                        // 3. إذن استثناء البطارية للعمل المستمر
                        SwitchListTile(
                          contentPadding: EdgeInsets.zero,
                          activeColor: const Color(0xFF064E3B),
                          value: _permBattery,
                          title: const Text(
                            'العمل في الخلفية دون قيود البطارية',
                            style: TextStyle(fontWeight: FontWeight.bold, fontSize: 13.5),
                          ),
                          subtitle: const Text(
                            'يضمن استمرار نطق الذكر عند فتح الشاشة وفي الخلفية',
                            style: TextStyle(fontSize: 11.5, color: Colors.grey),
                          ),
                          onChanged: (_) async {
                            try {
                              await _nativeChannel.invokeMethod('requestBatteryExemption');
                            } catch (_) {}
                          },
                        ),
                      ],
                    ),
                  ),
                ],
              );
            }

            // =================================================================
            // 5. تبويب سياسة الخصوصية (مطابق للصورة 3 المرفقة)
            // =================================================================
            Widget _buildPrivacyTab() {
              return ListView(
                padding: const EdgeInsets.all(14),
                children: [
                  Container(
                    padding: const EdgeInsets.all(16),
                    decoration: BoxDecoration(
                      color: const Color(0xFFECFDF5),
                      borderRadius: BorderRadius.circular(18),
                      border: Border.all(color: const Color(0xFFA7F3D0)),
                    ),
                    child: const Column(
                      crossAxisAlignment: CrossAxisAlignment.start,
                      children: [
                        Text(
                          '🛡️ التزام كامل بخصوصيتك (Data Not Collected)',
